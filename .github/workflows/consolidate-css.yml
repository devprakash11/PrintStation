name: Consolidate CSS files

on:
  push:
    branches: [main]
    paths:
      - 'src/styles/**'
      - 'src/**/*.jsx'
      - 'src/**/*.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    if: "!contains(github.event.head_commit.message, '[css-consolidated]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Consolidate page styles
        shell: bash
        run: |
          set -euo pipefail
          styles='src/styles'
          output="$styles/allPage.css"
          tmp="${output}.tmp"

          page_files=(
            adminAuth.css
            adminDashboard.css
            helpCenter.css
            multiFilePreview.css
            printerManagement.css
            printJobs.css
            printUpload.css
            qrCodeGenerateModal.css
            qrCodeManagement.css
            reports.css
            settings.css
            users.css
          )

          {
            printf '%s\n' '/* ========================================================='
            printf '%s\n' '   PRINTSTATION — PAGE STYLES'
            printf '%s\n' '   ========================================================= */'
            printf '%s\n\n' '/* Consolidated page-level stylesheet. Global design tokens, reset, typography and shared primitives remain in global.css. */'
            printf '%s\n\n' '/* =========================================================\n   01. EXISTING PAGE STYLES\n   ========================================================= */'
            cat "$output"

            section=2
            for file in "${page_files[@]}"; do
              if [ -f "$styles/$file" ]; then
                printf '\n\n/* =========================================================\n'
                printf '   %02d. %s\n' "$section" "${file%.css}"
                printf '   ========================================================= */\n\n'
                cat "$styles/$file"
                section=$((section + 1))
              fi
            done
          } > "$tmp"

          mv "$tmp" "$output"

      - name: Update CSS imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('src')
          old_names = {
              'adminAuth.css', 'adminDashboard.css', 'helpCenter.css',
              'multiFilePreview.css', 'printerManagement.css', 'printJobs.css',
              'printUpload.css', 'qrCodeGenerateModal.css', 'qrCodeManagement.css',
              'reports.css', 'settings.css', 'users.css'
          }

          for path in root.rglob('*'):
              if path.suffix not in {'.js', '.jsx', '.ts', '.tsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for name in old_names:
                  text = re.sub(
                      rf"(['\"])([^'\"]*?){re.escape(name)}\\1",
                      rf"\\1\\2allPage.css\\1",
                      text,
                  )
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Remove old CSS files
        shell: bash
        run: |
          rm -f \
            src/styles/adminAuth.css \
            src/styles/adminDashboard.css \
            src/styles/helpCenter.css \
            src/styles/multiFilePreview.css \
            src/styles/printerManagement.css \
            src/styles/printJobs.css \
            src/styles/printUpload.css \
            src/styles/qrCodeGenerateModal.css \
            src/styles/qrCodeManagement.css \
            src/styles/reports.css \
            src/styles/settings.css \
            src/styles/users.css

      - name: Commit consolidated CSS
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles src
          if git diff --cached --quiet; then
            echo 'No CSS consolidation changes required.'
            exit 0
          fi
          git commit -m 'refactor: consolidate CSS into pageAll and global [css-consolidated]'
          git push
